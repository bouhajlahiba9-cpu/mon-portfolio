        content: Système de gestion de l'accès et des enregistrements connecté à Google Sheets et une base de données. Permet de contrôler les entrées/sorties et d'enregistrer les données en temps réel.
        image: /images/projects/profile.png
        featured:
          name: Voir sur GitHub
          link: https://github.com/bouhajlahiba9-cpu
        badges:
          - "Python"
          - "Google Sheets API"
          - "Base de données"
          - "IoT"
        links:
          - icon: fab fa-github
            url: https://github.com/bouhajlahiba9-cpu

      - title: Portfolio Personnel
        content: Portfolio personnel conçu et déployé avec Hugo et le thème Hugo Profile. Hébergé sur GitHub Pages via Netlify.
        image: /images/projects/profile2.jpg
        featured:
          name: Voir le site
          link: https://bouhajlahiba9-cpu.github.io/mon-portfolio/
        badges:
          - "Hugo"
          - "HTML/CSS"
          - "GitHub Pages"
        links:
          - icon: fab fa-github
            url: https://github.com/bouhajlahiba9-cpu/mon-portfolio

