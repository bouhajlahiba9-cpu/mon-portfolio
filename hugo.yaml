  # Hero
  hero:
    enable: true
    intro: "Bonjour, je suis"
    title: "Hiba Bouhajla."
    subtitle: "Étudiante en Systèmes Embarqués & Services Numériques"
    content: "Passionnée par l'électronique, les systèmes embarqués et le développement numérique. J'aime concevoir des solutions qui allient hardware et software pour résoudre des problèmes concrets."
    image: /images/hero.svg
    bottomImage:
      enable: true
    button:
      enable: true
      name: "Mon CV"
      url: "#"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/bouhajlahiba9-cpu
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/hiba-bouhajla-b11929378

  # About
  about:
    enable: true
    title: "À Propos de Moi"
    image: "/images/me.png"
    content: |-
      Je suis étudiante en 1ère année à l'**Institut National des Postes et Télécommunications (INPT)** de Rabat, dans la filière **Systèmes Embarqués et Services Numériques**.

      Après deux années de classes préparatoires en filière PSI à Meknès, j'ai intégré l'INPT où je développe mes compétences en électronique, programmation embarquée et développement numérique.

      Je suis passionnée par la conception de systèmes intelligents combinant hardware et software, et je cherche à contribuer à des projets innovants.
    skills:
      enable: true
      title: "Compétences techniques :"
      items:
        - "C / C++"
        - "Python"
        - "HTML / CSS"
        - "Systèmes Embarqués"
        - "Arduino"
        - "Raspberry Pi"
        - "ESP32"
        - "VHDL / FPGA"

  # Experience
  experience:
    enable: true
    title: "Formation & Parcours"
    items:
      - company: "INPT - Institut National des Postes et Télécommunications"
        companyUrl: "https://www.inpt.ac.ma"
        jobs:
          - name: "Étudiante Ingénieure — Systèmes Embarqués & Services Numériques"
            date: "2025 - 2028"
            content: |
              Formation d'ingénieure à l'INPT Rabat dans la filière Systèmes Embarqués et Services Numériques.

              - Programmation embarquée (C/C++, Python)
              - Electronique numérique et FPGA (VHDL)
              - Microcontrôleurs : Arduino, ESP32, Raspberry Pi
              - Développement web et services numériques

      - company: "Classe Préparatoire — Meknès"
        companyUrl: "#"
        jobs:
          - name: "Étudiante en Classe Préparatoire — Filière PSI"
            date: "2023 - 2025"
            content: |
              Deux années de classes préparatoires aux grandes écoles en filière PSI (Physique, Sciences de l'Ingénieur) à Meknès.

              - Mathématiques avancées
              - Physique et Sciences de l'Ingénieur
              - Informatique et algorithmique

  # Education
  education:
    enable: true
    title: "Formation"
    index: false
    items:
      - title: "Diplôme d'Ingénieure — Systèmes Embarqués & Services Numériques"
        school:
          name: "INPT — Institut National des Postes et Télécommunications, Rabat"
          url: "https://www.inpt.ac.ma"
        date: "2025 - 2028"
        content: |-
          Formation d'ingénieure spécialisée en systèmes embarqués, électronique numérique et services numériques.

          Matières principales :
            - Programmation embarquée (C/C++, Python)
            - Electronique numérique et VHDL/FPGA
            - Microcontrôleurs et IoT
            - Développement web et cloud

      - title: "Classe Préparatoire — Filière PSI"
        school:
          name: "CPGE — Meknès"
          url: "#"
        date: "2023 - 2025"
        content: |-
          Formation intensive en mathématiques, physique et sciences de l'ingénieur préparant aux concours des grandes écoles d'ingénieurs.

          Activités :
            - Travaux pratiques en électronique et mécanique
            - Projets de modélisation et simulation

  # Achievements
  achievements:
    enable: true
    title: "Réalisations"
    items:
      - title: Admission à l'INPT
        content: Intégration de l'Institut National des Postes et Télécommunications de Rabat après concours national.
        image: /images/achievement.jpg
      - title: Diplôme Classes Préparatoires PSI
        content: Validation de deux années de CPGE filière PSI à Meknès avec succès.
        image: /images/achievement.jpg
      - title: Maîtrise multilingue
        content: Arabe (langue maternelle), Français (courant), Anglais (notions).
        image: /images/achievement.jpg

  # Projects
  projects:
